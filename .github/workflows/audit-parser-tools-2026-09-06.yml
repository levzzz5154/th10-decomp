name: Offline audit parser dependencies
on:
  push:
    branches: [audit/recovery-calibration-2026-09-06]
    paths: [.github/workflows/audit-parser-tools-2026-09-06.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download public parser wheels for the offline audit environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-parser-tools"
          python3 -m pip download tree-sitter tree-sitter-cpp --dest "$RUNNER_TEMP/audit-parser-tools" --only-binary=:all: --python-version 313 --implementation cp --abi cp313 --platform manylinux2014_x86_64 | tee "$RUNNER_TEMP/audit-parser-tools/download.log"
          cd "$RUNNER_TEMP/audit-parser-tools"
          sha256sum *.whl > SHA256SUMS.txt
      - name: Preserve parser packages and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-parser-tools-cp313
          path: ${{ runner.temp }}/audit-parser-tools/
          retention-days: 7
          if-no-files-found: error
