name: Pinned reconstruction audit evidence

on:
  push:
    branches: [audit/recovery-calibration-2026-09-06]
    paths: [.github/workflows/audit-evidence-2026-09-06.yml]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read immutable audit input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dcf2b5077a86c11ed886c3008bbe3b13f6c6df44
          fetch-depth: 0
          persist-credentials: false
      - name: Package exact source and history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/th10-audit-evidence"
          git branch audit-input dcf2b5077a86c11ed886c3008bbe3b13f6c6df44
          git bundle create "$RUNNER_TEMP/th10-audit-evidence/source.bundle" refs/heads/audit-input
          git rev-parse HEAD > "$RUNNER_TEMP/th10-audit-evidence/revision.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/th10-audit-evidence/tree.txt"
          sha256sum "$RUNNER_TEMP/th10-audit-evidence/source.bundle" > "$RUNNER_TEMP/th10-audit-evidence/source.sha256"
      - name: Install 32-bit host test support
        id: multilib
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update > "$RUNNER_TEMP/th10-audit-evidence/apt-update.log" 2>&1
          sudo apt-get install -y g++-multilib > "$RUNNER_TEMP/th10-audit-evidence/apt-install.log" 2>&1
      - name: Run unmodified integrity gates and host tests
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess, time
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'th10-audit-evidence'
          commands = [
              ('python-version', ['python3', '--version']),
              ('compiler-version', ['g++', '--version']),
              ('reference-integrity', ['python3', 'tools/audit_reference_corpus.py', '--check']),
              ('audit-integrity', ['bash', 'matching2/audit_check.sh']),
              ('host-tests', ['bash', 'matching2/test.sh']),
              ('host-contract-strict', ['python3', 'matching2/tools/audit_host_contracts.py', '--strict']),
          ]
          results = {'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'platform': platform.platform(), 'cwd': os.getcwd(), 'runs': [],
                     'limits': ['No retail process or game assets executed.',
                                'A strict host-contract failure is retained, not suppressed.',
                                'Passing checks are not semantic or visual equivalence.']}
          for name, command in commands:
              start = time.monotonic()
              log = output / (name + '.log')
              try:
                  with log.open('w') as stream:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, timeout=360)
                  code = result.returncode
                  status = 'executed'
              except subprocess.TimeoutExpired:
                  code, status = None, 'timeout'
              results['runs'].append({'name': name, 'command': command, 'exit_code': code,
                                      'status': status, 'elapsed_seconds': round(time.monotonic()-start, 3),
                                      'log': log.name})
              print(name, status, code, flush=True)
          results['working_tree_after'] = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          (output / 'results.json').write_text(json.dumps(results, indent=2)+'\n')
          print(json.dumps(results, indent=2))
          PY
      - name: Preserve private audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: th10-audit-input-dcf2b507
          path: ${{ runner.temp }}/th10-audit-evidence/
          if-no-files-found: error
          retention-days: 7
