<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>Touhou 10 retail byte comparison</title>
  <desc>All 2,322 of 2,322 game-code regions are byte-exact. The default executable matches retail bit for bit (0 bytes differ).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16131c"/>
      <stop offset="1" stop-color="#211a1f"/>
    </linearGradient>
    <linearGradient id="exact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8743b"/>
      <stop offset="1" stop-color="#f29a4a"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#3a2f2c"/>
      <rect width="3" height="8" fill="#5a463d"/>
    </pattern>
    <clipPath id="bar"><rect width="1072" height="34" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <g font-family="Fira Sans, DejaVu Sans, sans-serif">
    <text x="64" y="92" font-size="20" fill="#f29a4a" letter-spacing="3" font-weight="600">MATCHING DECOMPILATION · STATUS 2026-11-25</text>
    <text x="64" y="142" font-size="46" fill="#f4ede6" font-weight="700">Touhou 10 ~ Mountain of Faith</text>
    <text x="64" y="180" font-size="21" fill="#b6aaa3">The default th10.exe, compared byte for byte with retail</text>

    <!-- headline numbers -->
    <g transform="translate(64 232)">
      <rect width="336" height="150" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="78" font-size="64" font-weight="700" fill="#f4ede6">2,322</text>
      <text x="24" y="114" font-size="19" fill="#d8cdc6">byte-exact regions</text>
      <text x="24" y="138" font-size="15" fill="#b6aaa3">of 2,322 game-code regions</text>
    </g>
    <g transform="translate(432 232)">
      <rect width="336" height="150" rx="14" fill="#e8743b" fill-opacity="0.10" stroke="#e8743b" stroke-opacity="0.45"/>
      <text x="24" y="78" font-size="53" font-weight="700" fill="#f29a4a">100%</text>
      <text x="24" y="114" font-size="19" fill="#d8cdc6">of game-code bytes match retail</text>
      <text x="24" y="138" font-size="15" fill="#b6aaa3">322,064 of 322,064 at retail offsets</text>
    </g>
    <g transform="translate(800 232)">
      <rect width="336" height="150" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="78" font-size="64" font-weight="700" fill="#f4ede6">0</text>
      <text x="24" y="114" font-size="19" fill="#d8cdc6">bytes differ from retail</text>
      <text x="24" y="138" font-size="15" fill="#b6aaa3">in the 487,936-byte executable</text>
    </g>

    <!-- bar -->
    <text x="64" y="428" font-size="16" fill="#b6aaa3">Game-code bytes by region status · excludes runtime libraries and padding outside game regions</text>
    <g transform="translate(64 442)" clip-path="url(#bar)">
      <rect width="1072" height="34" fill="url(#exact)"/>
    </g>
    <g font-size="15" fill="#d8cdc6" transform="translate(64 504)">
      <rect y="-12" width="14" height="14" rx="3" fill="#f29a4a"/>
      <text x="22" y="0">100% · fully matched regions (322,064 bytes)</text>
    </g>

    <!-- facts -->
    <g font-size="17" fill="#d8cdc6" transform="translate(64 560)">
      <circle cx="5" cy="-5" r="4" fill="#f29a4a"/>
      <text x="20" y="0">Item update 0x0041AFD0: 2,320/2,320 bytes exact</text>
      <circle cx="5" cy="27" r="4" fill="#f29a4a"/>
      <text x="20" y="32">0 equivalent fallbacks · 473/473 item differential cases pass</text>
      <circle cx="585" cy="-5" r="4" fill="#f29a4a"/>
      <text x="600" y="0">Five matched renderer functions use inline x87</text>
      <circle cx="585" cy="27" r="4" fill="#f29a4a"/>
      <text x="600" y="32"><tspan font-family="DejaVu Sans Mono, monospace" fill="#f4ede6">make</tspan> reproduces the retail SHA-256 directly</text>
    </g>

    <line x1="64" y1="622" x2="1136" y2="622" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="64" y="650" font-size="16" fill="#8f837c">github.com/levzzz5154/th10-decomp</text>
    <text x="1136" y="650" font-size="16" fill="#8f837c" text-anchor="end">Verified against the retail executable</text>
  </g>
</svg>
